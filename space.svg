<svg xmlns="http://www.w3.org/2000/svg" width="900" height="160" viewBox="0 0 900 160">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f2027"/>
      <stop offset="0.5" stop-color="#203a43"/>
      <stop offset="1" stop-color="#2c5364"/>
    </linearGradient>
    <radialGradient id="planet" cx="0.35" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#ffb86b"/>
      <stop offset="1" stop-color="#c2410c"/>
    </radialGradient>
    <radialGradient id="glow">
      <stop offset="0.3" stop-color="#7c3aed" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="900" height="160" fill="url(#sky)"/>

  <g fill="#fff">
    <circle cx="60" cy="30" r="1.5"><animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="120" r="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="50" r="1.5"><animate attributeName="opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="430" cy="130" r="1"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="25" r="1.5"><animate attributeName="opacity" values="1;0.2;1" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="690" cy="95" r="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="800" cy="40" r="1.5"><animate attributeName="opacity" values="1;0.3;1" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="860" cy="130" r="1"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- black hole -->
  <g transform="translate(780 80)">
    <circle r="62" fill="url(#glow)"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
      <ellipse rx="58" ry="14" fill="none" stroke="#f97316" stroke-width="4" opacity="0.8" stroke-dasharray="40 14" transform="rotate(-15)"/>
      <ellipse rx="44" ry="10" fill="none" stroke="#fde68a" stroke-width="3" opacity="0.9" stroke-dasharray="26 10" transform="rotate(-15)"/>
    </g>
    <circle r="20" fill="#000" stroke="#a78bfa" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- planet drifting right to left -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="960 0" to="-120 0" dur="30s" repeatCount="indefinite"/>
    <circle cx="0" cy="45" r="22" fill="url(#planet)"/>
    <ellipse cx="0" cy="45" rx="38" ry="8" fill="none" stroke="#fde68a" stroke-width="2" opacity="0.8" transform="rotate(-20 0 45)"/>
  </g>

  <!-- UFO flying left to right, bobbing -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="-100 0;1000 0" dur="14s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 12;0 0" dur="2s" repeatCount="indefinite"/>
      <polygon points="-20,70 20,70 55,150 -55,150" fill="url(#beam)">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite"/>
      </polygon>
      <ellipse cx="0" cy="58" rx="16" ry="14" fill="#7dd3fc" opacity="0.85"/>
      <ellipse cx="0" cy="68" rx="40" ry="11" fill="#94a3b8"/>
      <ellipse cx="0" cy="65" rx="40" ry="8" fill="#cbd5e1"/>
      <circle cx="-24" cy="70" r="3" fill="#facc15"><animate attributeName="opacity" values="1;0.2;1" dur="0.8s" repeatCount="indefinite"/></circle>
      <circle cx="0" cy="73" r="3" fill="#f472b6"><animate attributeName="opacity" values="0.2;1;0.2" dur="0.8s" repeatCount="indefinite"/></circle>
      <circle cx="24" cy="70" r="3" fill="#4ade80"><animate attributeName="opacity" values="1;0.2;1" dur="0.8s" repeatCount="indefinite"/></circle>
    </g>
  </g>
</svg>
